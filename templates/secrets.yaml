{{- /*
JWT signing secret for the admin console, rendered only with secrets.create=true.
By default (false) it already exists out of band and the chart never touches
it, so an upgrade cannot overwrite a real key with an empty one.
*/ -}}
{{- if .Values.secrets.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: k3s-mcp-admin-secrets
  namespace: {{ include "mcp-server.ns" . }}
  labels:
    app.kubernetes.io/name: k3s-mcp-admin
    {{- include "mcp-server.partOf" . | nindent 4 }}
  {{- include "mcp-server.keepAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  jwt-secret: {{ required "secrets.jwtSecret is required when secrets.create=true" .Values.secrets.jwtSecret | quote }}
{{- end }}
