{{- /*
k3s-mcp-admin console. Was k8s-manifests/30-mcp-admin.yaml.
The ClusterRole/ClusterRoleBinding names are release-derived
(mcp-server.adminClusterRoleName/BindingName) because they are cluster-scoped:
a second fixed-name "k3s-mcp-admin-role"/"k3s-mcp-admin-binding" would collide
with the legacy mcp-system install's objects of the same name.
*/ -}}
{{- if .Values.admin.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k3s-mcp-admin-sa
  namespace: {{ include "mcp-server.ns" . }}
  labels:
    app.kubernetes.io/name: k3s-mcp-admin
    {{- include "mcp-server.partOf" . | nindent 4 }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mcp-server.adminClusterRoleName" . }}
  labels:
    app.kubernetes.io/name: k3s-mcp-admin
rules:
  # Read cluster-wide resources
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods", "pods/log", "services", "configmaps", "events"]
    verbs: ["get", "list", "watch"]
  # Patch ConfigMaps (token rotation in nginx config)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["patch", "update"]
  # Read and restart Deployments
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
  # Metrics (optional)
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mcp-server.adminClusterRoleBindingName" . }}
  labels:
    app.kubernetes.io/name: k3s-mcp-admin
subjects:
  - kind: ServiceAccount
    name: k3s-mcp-admin-sa
    namespace: {{ include "mcp-server.ns" . }}
roleRef:
  kind: ClusterRole
  name: {{ include "mcp-server.adminClusterRoleName" . }}
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k3s-mcp-admin-data
  namespace: {{ include "mcp-server.ns" . }}
  labels:
    app.kubernetes.io/name: k3s-mcp-admin
  {{- include "mcp-server.keepAnnotations" . | nindent 2 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.admin.storage.size }}
  storageClassName: {{ include "mcp-server.storageClass" (list . .Values.admin.storage.className) }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k3s-mcp-admin
  namespace: {{ include "mcp-server.ns" . }}
  labels:
    app.kubernetes.io/name: k3s-mcp-admin
    app.kubernetes.io/part-of: kubernetes-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k3s-mcp-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k3s-mcp-admin
        app.kubernetes.io/part-of: kubernetes-mcp-server
    spec:
      {{- with .Values.admin.image.pullSecrets }}
      # Needed whenever admin.image lives in a registry that requires auth. The
      # original value points at an insecure in-cluster mirror declared in the
      # node's registries.yaml, so no secret was ever required and the chart had
      # no way to express one - which blocked deploying it to any other cluster.
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: k3s-mcp-admin-sa
      containers:
        - name: admin
          image: "{{ .Values.admin.image.repository }}:{{ .Values.admin.image.tag }}"
          imagePullPolicy: {{ .Values.admin.image.pullPolicy }}
          ports:
            - containerPort: 9001
              name: http
          env:
            - name: NAMESPACE
              value: {{ include "mcp-server.ns" . | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: k3s-mcp-admin-secrets
                  key: jwt-secret
            - name: MCP_EXTERNAL_URL
              value: {{ .Values.admin.externalUrl | quote }}
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.admin.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: 9001
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9001
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: k3s-mcp-admin-data

---
apiVersion: v1
kind: Service
metadata:
  name: k3s-mcp-admin-svc
  namespace: {{ include "mcp-server.ns" . }}
  labels:
    app.kubernetes.io/name: k3s-mcp-admin
    app.kubernetes.io/part-of: kubernetes-mcp-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: k3s-mcp-admin
  ports:
    - name: http
      port: 9001
      targetPort: 9001
{{- end }}
