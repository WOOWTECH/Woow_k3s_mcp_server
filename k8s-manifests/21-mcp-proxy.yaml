# MCP Proxy for kubernetes-mcp-server
# Token-authenticated nginx reverse proxy + Cloudflare tunnel access
# Pattern: same as changqing-odoo MCP proxy
#
# Client URL: https://{your-hostname}/private_{your-token}/mcp
# Generate token: python3 -c "import secrets; print(secrets.token_hex(16))"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-k8s-proxy-config
  namespace: mcp-system
data:
  nginx.conf: |
    events {
      worker_connections 1024;
    }
    http {
      server {
        listen 8001;

        # Health check for K8s probes
        location /health {
          return 200 'ok';
          add_header Content-Type text/plain;
        }

        # Token-authenticated MCP proxy
        location /private_YOUR_TOKEN_HERE/ {
          rewrite ^/private_YOUR_TOKEN_HERE/(.*) /$1 break;
          proxy_pass http://kubernetes-mcp-server:8080;
          proxy_set_header Host localhost;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_http_version 1.1;
          proxy_set_header Connection '';
          proxy_buffering off;
          proxy_cache off;
          chunked_transfer_encoding off;
          proxy_read_timeout 86400s;
          proxy_send_timeout 86400s;
        }

        # Deny all other paths
        location / {
          return 403;
        }
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-k8s-proxy
  namespace: mcp-system
  labels:
    app.kubernetes.io/name: mcp-k8s-proxy
    app.kubernetes.io/part-of: kubernetes-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-k8s-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-k8s-proxy
        app.kubernetes.io/part-of: kubernetes-mcp-server
    spec:
      containers:
        - name: proxy
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: proxy-http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 30
          volumeMounts:
            - name: proxy-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: proxy-config
          configMap:
            name: mcp-k8s-proxy-config
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: mcp-k8s-proxy-svc
  namespace: mcp-system
  labels:
    app.kubernetes.io/name: mcp-k8s-proxy
    app.kubernetes.io/part-of: kubernetes-mcp-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcp-k8s-proxy
  ports:
    - name: proxy
      port: 8001
      targetPort: 8001
