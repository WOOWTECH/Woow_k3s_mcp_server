# K3s MCP Admin GUI
# Web management interface for kubernetes-mcp-server
# Provides: Dashboard, Tool Manager, Token Manager, Log Viewer, Cluster Overview, Settings

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k3s-mcp-admin-sa
  namespace: mcp-system
  labels:
    app.kubernetes.io/name: k3s-mcp-admin
    app.kubernetes.io/part-of: kubernetes-mcp-server

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k3s-mcp-admin-role
  labels:
    app.kubernetes.io/name: k3s-mcp-admin
rules:
  # Read cluster-wide resources
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods", "pods/log", "services", "configmaps", "events"]
    verbs: ["get", "list", "watch"]
  # Patch ConfigMaps (token rotation in nginx config)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["patch", "update"]
  # Read and restart Deployments
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
  # Metrics (optional)
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k3s-mcp-admin-binding
  labels:
    app.kubernetes.io/name: k3s-mcp-admin
subjects:
  - kind: ServiceAccount
    name: k3s-mcp-admin-sa
    namespace: mcp-system
roleRef:
  kind: ClusterRole
  name: k3s-mcp-admin-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: Secret
metadata:
  name: k3s-mcp-admin-secrets
  namespace: mcp-system
  labels:
    app.kubernetes.io/name: k3s-mcp-admin
type: Opaque
stringData:
  jwt-secret: "PLACEHOLDER_REPLACE_AT_DEPLOY"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k3s-mcp-admin-data
  namespace: mcp-system
  labels:
    app.kubernetes.io/name: k3s-mcp-admin
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Mi
  storageClassName: local-path

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k3s-mcp-admin
  namespace: mcp-system
  labels:
    app.kubernetes.io/name: k3s-mcp-admin
    app.kubernetes.io/part-of: kubernetes-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k3s-mcp-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k3s-mcp-admin
        app.kubernetes.io/part-of: kubernetes-mcp-server
    spec:
      serviceAccountName: k3s-mcp-admin-sa
      containers:
        - name: admin
          image: your-registry/k3s-mcp-admin:latest  # Replace with your image
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9001
              name: http
          env:
            - name: NAMESPACE
              value: "mcp-system"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: k3s-mcp-admin-secrets
                  key: jwt-secret
            - name: MCP_EXTERNAL_URL
              value: "https://your-k8s-mcp.example.com"  # Replace with your MCP URL
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 9001
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9001
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: k3s-mcp-admin-data

---
apiVersion: v1
kind: Service
metadata:
  name: k3s-mcp-admin-svc
  namespace: mcp-system
  labels:
    app.kubernetes.io/name: k3s-mcp-admin
    app.kubernetes.io/part-of: kubernetes-mcp-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: k3s-mcp-admin
  ports:
    - name: http
      port: 9001
      targetPort: 9001
