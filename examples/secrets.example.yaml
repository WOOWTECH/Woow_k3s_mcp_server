# -----------------------------------------------------------------------------
# Secrets for Woow_k3s_mcp_server - PLACEHOLDERS ONLY. Never commit real values.
#
# Used with the default secrets.create=false: the chart only references this
# Secret by name. Copy this file OUTSIDE the repo, replace every REPLACE_ME
# value, then apply that copy:
#   kubectl --context <ctx> apply -f /secure/path/secrets.yaml
#
# The proxy token (values: proxy.token) is NOT a Kubernetes Secret in this
# design - it is baked into the mcp-k8s-proxy-config ConfigMap's nginx.conf,
# because nginx matches it directly in the URL path. Pass it with
# --set proxy.token=... (or a values file kept outside the repo), never commit
# a real value in values.yaml or deploy/**/*.yaml.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: k3s-mcp-admin-secrets
  namespace: mcp-helm
  labels:
    app.kubernetes.io/part-of: woow-mcp-server
type: Opaque
stringData:
  # Signs the admin console's session JWTs. Generate with:
  #   python3 -c "import secrets; print(secrets.token_hex(32))"
  jwt-secret: "REPLACE_ME_JWT_SIGNING_KEY"
